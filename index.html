<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オススメの曲</title>
  <meta name="description" content="オススメの曲をYouTubeで聴く。">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f4; color: #292722; font-family: system-ui, sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 80px 24px; }
    h1 { font-size: clamp(28px, 6vw, 40px); margin: 0 0 32px; }
    a { display: flex; align-items: center; gap: 20px; padding: 28px; border: 1px solid #ded9d0; border-radius: 18px; background: white; color: inherit; text-decoration: none; }
    a:hover { background: #f0ede6; }
    a:focus-visible { outline: 3px solid #77613e; outline-offset: 5px; }
    .icon { font-size: 36px; color: #77613e; }
    h2 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 0; font-size: 14px; color: #696257; }
    @media (max-width: 480px) { main { padding: 48px 20px; } a { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <h1>オススメの曲</h1>
    <a href="https://www.youtube.com/watch?v=fzwpfU5M848" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">♫</span>
      <div>
        <h2>オススメの一曲</h2>
        <p>YouTubeで聴く ↗ <small>（新しいタブ）</small></p>
      </div>
    </a>
  </main>
</body>
</html>
